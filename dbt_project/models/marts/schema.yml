version: 2

models:
  - name: fct_repo_activity
    description: "Daily aggregate of repository activity."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo_name, activity_date]
    columns:
      - name: repo_name
        tests: [not_null]
      - name: activity_date
        tests: [not_null]
      - name: unique_contributors
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= total_events"

  - name: dim_developer_leaderboard
    columns:
      - name: actor_id
        tests: [not_null, unique]